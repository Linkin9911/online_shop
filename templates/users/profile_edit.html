{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <h1>Мой профиль</h1>
        {% if user.avatar %}
        <img src="{{ user.avatar.url }}" alt="Аватар" class="img-thumbnail mb-3" width="120">
        {% endif %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
