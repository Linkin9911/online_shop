<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Подключаем Bootstrap (если он у тебя уже подключён в проекте — можно убрать, если нет — оставь, страницы сразу станут красивыми) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>{% block title %}Мой магазин{% endblock %}</title>

    <!-- Твой основной CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <header class="bg-light p-3 border-bottom">
        <div class="container">
            <h1 class="m-0 d-inline-block">Online Shop</h1>

            <!-- ГЛАВНОЕ МЕНЮ: твой путь верный -->
            {% include 'catalog/_menu.html' %}
        </div>
    </header>

    <main class="container py-4">
        <!-- Сюда будет вставляться контент из шаблонов блога и каталога -->
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light text-center py-3 border-top mt-5">
        <p class="mb-0">&copy; 2026 Online Shop. Все права защищены.</p>
    </footer>

    <!-- Если у тебя в проекте есть JS-скрипты, подключай их здесь -->
    <!-- <script src="{% static 'js/main.js' %}"></script> -->
</body>
</html>
